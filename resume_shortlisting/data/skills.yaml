# Skill knowledge base for keyword matching and rule-based tech detection.
# Fully data-driven — extend this file to teach the matcher new skills without
# touching any Python code (Step 22).
#
# Three sections:
#   canonical_skills : canonical skill name -> list of aliases/synonyms
#   phrase_rules     : a natural-language phrase -> technologies it implies
#   genai_markers    : tokens that flag a project as "GenAI" (Step 12 bonus)

# --------------------------------------------------------------------------- #
# canonical_skills: the left-hand key is the canonical display name; the list
# holds every surface form that should match it. Matching is case-insensitive
# and word-boundary aware.
# --------------------------------------------------------------------------- #
canonical_skills:
  # Languages
  Python: [python, py, python3]
  JavaScript: [javascript, js, ecmascript, es6]
  TypeScript: [typescript, ts]
  Java: [java]
  C++: ["c++", cpp, cplusplus]
  C: [c language, "c programming"]
  "C#": ["c#", csharp, "c sharp"]
  Go: [golang, "go lang"]
  Rust: [rust]
  Ruby: [ruby]
  PHP: [php]
  Swift: [swift]
  Kotlin: [kotlin]
  R: [r language, rlang]
  Scala: [scala]
  SQL: [sql]

  # Frontend
  React: [react, reactjs, "react.js", "react js"]
  "Next.js": [nextjs, "next.js", "next js"]
  Angular: [angular, angularjs]
  Vue: [vue, vuejs, "vue.js"]
  HTML: [html, html5]
  CSS: [css, css3]
  Tailwind: [tailwind, tailwindcss, "tailwind css"]
  Bootstrap: [bootstrap]
  Redux: [redux]
  jQuery: [jquery]

  # Backend / frameworks
  Node.js: [node, nodejs, "node.js", "node js"]
  Express: [express, expressjs, "express.js"]
  Django: [django]
  "Django REST Framework": [drf, "django rest framework", "django-rest-framework"]
  Flask: [flask]
  FastAPI: [fastapi, "fast api"]
  "Spring Boot": [spring, "spring boot", springboot]
  ".NET": [".net", dotnet, "asp.net", aspnet]
  Laravel: [laravel]
  Rails: ["ruby on rails", rails]

  # Databases
  PostgreSQL: [postgresql, postgres, psql]
  MySQL: [mysql]
  MongoDB: [mongodb, mongo]
  Redis: [redis]
  SQLite: [sqlite]
  Oracle: ["oracle db", "oracle database"]
  "SQL Server": ["sql server", mssql, "microsoft sql server"]
  Cassandra: [cassandra]
  DynamoDB: [dynamodb]
  Elasticsearch: [elasticsearch, elastic search]
  Firebase: [firebase, firestore]

  # Cloud / DevOps
  AWS: [aws, "amazon web services", ec2, s3, lambda]
  Azure: [azure, "microsoft azure"]
  GCP: [gcp, "google cloud", "google cloud platform"]
  Docker: [docker]
  Kubernetes: [kubernetes, k8s]
  Terraform: [terraform]
  Jenkins: [jenkins]
  "CI/CD": ["ci/cd", cicd, "ci cd"]
  Git: [git]
  GitHub: [github]
  GitLab: [gitlab]
  Nginx: [nginx]
  Linux: [linux, ubuntu, unix]

  # Data / ML / AI
  "Machine Learning": ["machine learning", ml]
  "Deep Learning": ["deep learning", dl]
  "Data Science": ["data science"]
  NLP: [nlp, "natural language processing"]
  "Computer Vision": ["computer vision", cv, opencv]
  TensorFlow: [tensorflow, "tensor flow"]
  PyTorch: [pytorch, torch]
  "scikit-learn": ["scikit-learn", sklearn, "scikit learn"]
  Pandas: [pandas]
  NumPy: [numpy]
  Keras: [keras]
  OpenCV: [opencv]

  # GenAI / LLM
  GenAI: [genai, "generative ai", "gen ai"]
  LLM: [llm, "large language model", "large language models"]
  RAG: [rag, "retrieval augmented generation", "retrieval-augmented generation"]
  LangChain: [langchain, "lang chain"]
  LlamaIndex: [llamaindex, "llama index"]
  OpenAI: [openai, gpt, "gpt-4", chatgpt, "gpt-3.5"]
  Gemini: [gemini, "google gemini"]
  "Hugging Face": ["hugging face", huggingface, transformers]
  "Vector Database": ["vector database", "vector db", pinecone, chroma, chromadb, faiss, weaviate]
  "Prompt Engineering": ["prompt engineering"]

  # APIs / misc
  "REST API": ["rest api", restful, rest]
  GraphQL: [graphql]
  gRPC: [grpc]
  Kafka: [kafka, "apache kafka"]
  RabbitMQ: [rabbitmq]
  Selenium: [selenium]
  pytest: [pytest, "py test"]
  Jupyter: [jupyter, "jupyter notebook"]
  Tableau: [tableau]
  "Power BI": ["power bi", powerbi]
  Excel: [excel, "ms excel", "microsoft excel"]
  Flutter: [flutter]
  "React Native": ["react native"]

# --------------------------------------------------------------------------- #
# phrase_rules: infer technologies from descriptive language even when the exact
# keyword is absent (Step 8, rule-based replacement for the LLM). The key is a
# phrase to search for; the value is the list of canonical techs it implies.
# --------------------------------------------------------------------------- #
phrase_rules:
  "retrieval augmented generation": [RAG, GenAI, LLM]
  "retrieval-augmented generation": [RAG, GenAI, LLM]
  "question answering over documents": [RAG, LLM, NLP]
  "chatbot": [NLP, GenAI]
  "conversational ai": [NLP, GenAI, LLM]
  "large language model": [LLM, GenAI]
  "fine-tuned": [LLM, "Machine Learning"]
  "fine tuning": [LLM, "Machine Learning"]
  "text classification": [NLP, "Machine Learning"]
  "sentiment analysis": [NLP, "Machine Learning"]
  "named entity recognition": [NLP]
  "image classification": ["Computer Vision", "Deep Learning"]
  "object detection": ["Computer Vision", "Deep Learning"]
  "face recognition": ["Computer Vision", "Deep Learning"]
  "recommendation system": ["Machine Learning"]
  "recommender system": ["Machine Learning"]
  "predictive model": ["Machine Learning"]
  "neural network": ["Deep Learning"]
  "semantic search": ["Vector Database", NLP]
  "vector search": ["Vector Database"]
  "embeddings": ["Vector Database", NLP]
  "rest endpoints": ["REST API"]
  "microservices": [Docker]
  "containerized": [Docker]
  "single page application": [React]
  "responsive web": [HTML, CSS]

# --------------------------------------------------------------------------- #
# genai_markers: if any of these canonical techs are detected in a project, it
# counts as a "GenAI project" for the Step-12 +20 bonus.
# --------------------------------------------------------------------------- #
genai_markers:
  - GenAI
  - LLM
  - RAG
  - LangChain
  - LlamaIndex
  - OpenAI
  - Gemini
  - Hugging Face
  - Prompt Engineering
